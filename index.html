<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغامرة النجوم</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;min-height:100%;font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;background:linear-gradient(180deg,#7ad7ff,#c6f0ff 60%,#fff6c9);color:#2b2b55;color-scheme:light}
#app{max-width:480px;margin:0 auto;padding:14px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.stars{background:#fff;border-radius:30px;padding:6px 16px;font-size:22px;font-weight:700;box-shadow:0 3px 0 #0002}
.back{background:#fff;border:0;border-radius:50%;width:46px;height:46px;font-size:24px;box-shadow:0 3px 0 #0002}
h1{font-size:34px;margin:6px 0;color:#e4572e;text-shadow:0 3px 0 #fff}
body::before{content:"☁️        ⭐        ☁️        ✨        🎈";position:fixed;top:14%;left:0;right:0;white-space:nowrap;font-size:40px;opacity:.55;animation:fl 22s linear infinite;pointer-events:none}
@keyframes fl{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
@keyframes bn{50%{transform:translateY(-8px) rotate(3deg)}}
#app{position:relative;z-index:1}
.card{animation:bn 3s ease-in-out infinite}.card:nth-child(2n){animation-delay:.5s}.card:nth-child(3n){animation-delay:1s}
.mas{font-size:64px;line-height:1;animation:bn 2s ease-in-out infinite}
.bub{background:#fff;border-radius:20px;padding:6px 14px;display:inline-block;font-weight:700;font-size:16px;box-shadow:0 3px 0 #0002;margin-bottom:6px}
.sub{font-size:18px;margin:0 0 12px}
.age{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.age button{flex:1;border:0;border-radius:18px;padding:10px;font-size:17px;font-weight:700;background:#fff;color:#2b2b55;box-shadow:0 3px 0 #0002}
.age button.on{background:#ff9f1c;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:0;border-radius:26px;padding:22px 8px;font-size:22px;font-weight:700;color:#fff;box-shadow:0 6px 0 #0003;display:flex;flex-direction:column;gap:6px;align-items:center}
.card span{font-size:54px}
.card:active,.opt:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
.q{font-size:24px;font-weight:700;margin:8px 0}
.show{background:#fff;border-radius:28px;padding:16px;min-height:140px;font-size:44px;line-height:1.3;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;box-shadow:0 5px 0 #0002;margin-bottom:16px}
.show.big{font-size:100px;font-weight:700;color:#e4572e}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border:0;border-radius:22px;background:#fff;min-height:96px;font-size:50px;font-weight:700;color:#2b2b55;box-shadow:0 5px 0 #0003}
.opt.bad{animation:sh .4s;background:#ffd1d1}
.opt.good{background:#b9f6ca}
.mem{display:grid;gap:10px}.mc{border:0;border-radius:18px;background:#ffb3d1;min-height:84px;font-size:44px;box-shadow:0 4px 0 #0003}.mc.up{background:#fff}
.dot{display:inline-block;width:64px;height:64px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 0 #0003}
.cheer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;pointer-events:none;animation:pop 1.1s forwards}
input{-webkit-user-select:text;user-select:text}
.hud{display:flex;align-items:center;gap:8px;margin-bottom:2px;font-size:15px}.bar{flex:1;height:14px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 0 #0002}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd43b,#ff922b);transition:width .4s}
.cf{position:fixed;top:-40px;font-size:28px;z-index:9;pointer-events:none;animation:fall 2.5s linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.sky{position:relative;height:58vh;overflow:hidden;border-radius:24px;background:#fff6}.bl{position:absolute;bottom:-100px;width:70px;height:84px;border-radius:50% 50% 48% 48%;font-size:34px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;animation:up 6s linear forwards;box-shadow:inset -6px -8px 0 #0002}@keyframes up{to{transform:translateY(-70vh)}}
.tb{height:12px;background:#fff;border-radius:8px;overflow:hidden;margin:-6px 0 12px}.tb i{display:block;height:100%;background:#ff4d4d;animation:shr linear forwards}@keyframes shr{from{width:100%}to{width:0}}
.slots{display:flex;gap:8px;justify-content:center;margin-bottom:16px}.slots span{width:54px;height:62px;background:#fff;border-radius:14px;font-size:40px;font-weight:700;line-height:62px;box-shadow:0 4px 0 #0002}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var age=0,stars=0,app=document.getElementById('app'),cols=['#ff6b6b','#4ecdc4','#a06cd5','#ff9f1c','#5c7cfa'],AV=['🦊','🐼','🐯','🐸','🦄','🐵','🐰','🐙'],sel='🦊';
var db={list:[],cur:-1},P=null,gi=0,lv=1,ok=0,hearts=3,streak=0,del=false;
try{db=JSON.parse(localStorage.getItem('kdb'))||db}catch(e){}
function save(){try{localStorage.setItem('kdb',JSON.stringify(db))}catch(e){}}
var R=function(a,b){return a+Math.floor(Math.random()*(b-a+1))};
var pick=function(a){return a[R(0,a.length-1)]};
var shuffle=function(a){return a.slice().sort(function(){return Math.random()-.5})};
function speak(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
var ac;function tone(f,d){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function addStar(){stars++;if(P){P.stars=stars;save()}}
var fruits=['🍎','🍌','🍓','🍇','🍊','🐟','⭐','🎈','🦋','🚗'];
var letters=[['أ','أرنب','🐰'],['ب','بطة','🦆'],['ت','تفاحة','🍎'],['ث','ثعلب','🦊'],['ج','جمل','🐪'],['ح','حصان','🐴'],['ز','زرافة','🦒'],['س','سمكة','🐟'],['ع','عنب','🍇'],['ف','فيل','🐘'],['ق','قطة','🐱'],['ن','نحلة','🐝'],['ك','كلب','🐶'],['م','موزة','🍌'],['د','دب','🐻'],['و','وردة','🌹']];
var colors=[['الأحمر','#e53935'],['الأزرق','#1e88e5'],['الأخضر','#43a047'],['الأصفر','#fdd835'],['البرتقالي','#fb8c00'],['البنفسجي','#8e24aa'],['الوردي','#ec407a'],['البني','#6d4c41']];
var games=[['عدّ معي','🔢','#ff6b6b',count],['الحروف','🔤','#4ecdc4',letter],['الألوان','🎨','#a06cd5',color],['الحساب','➕','#ff9f1c',math],['الحيوانات','🦁','#2ec4b6',animal],['الأشكال','🔷','#5c7cfa',shape],['الذاكرة','🧠','#f06595',memory],['كمّل النمط','🧩','#74b816',pattern],['الأيام','📅','#339af0',days],['الأضداد','↔️','#e8590c',opp],['إنجليزي','🇬🇧','#364fc7',eng],['الرقم الناقص','🔟','#d6336c',missing],['إسلاميات','🕌','#2b8a3e',islamQ],['الصلاة','🤲','#0b7285',salah],['أذكار','📿','#7048e8',adhkar],['قصص الأنبياء','🐋','#e67700',prophet],['سور القرآن','📖','#087f5b',surah],['أخلاق حلوة','💖','#c2255c',akhlaq],['فقّع البالون','🎈','#ff6b6b',balloon],['وصّل','🔗','#20c997',match],['ركّب الكلمة','✏️','#845ef7',spell],['سباق الوقت','⏱️','#fa5252',race]];

function home(){clearInterval(tm);
  app.innerHTML='<div class="top"><button class="back" onclick="who()">'+P.a+'</button><div class="stars">⭐ '+stars+'</div></div><div class="mas">'+mch()+'</div><div class="bub">أهلاً '+P.n+'! '+msg()+'</div><h1>🌟 مغامرة النجوم 🌟</h1><p class="sub">اختر عمرك ثم اللعبة!</p><div class="bub" style="font-size:14px;background:#fff8c9">🎁 هدية من خالو سامر وزوجته لمريم وخلدون 💖</div>'+
  '<div class="age"><button class="'+(age==0?'on':'')+'" onclick="setAge(0)">🧒 ٤ - ٥ سنوات</button><button class="'+(age==1?'on':'')+'" onclick="setAge(1)">👦 ٦ - ٨ سنوات</button></div><div class="age"><button class="'+(P.rd!==false?'on':'')+'" onclick="P.rd=(P.rd===false);save();home()">📢 اقرأ لي الأسئلة والأجوبة: '+(P.rd!==false?'شغّال ✅':'مطفّأ')+'</button></div><div class="age"><button class="'+(cat==0?'on':'')+'" onclick="cat=0;home()">🎮 تعليمية</button><button class="'+(cat==1?'on':'')+'" onclick="cat=1;home()">🕌 دينية</button><button class="'+(cat==2?'on':'')+'" onclick="cat=2;home()">🎪 مرحة</button></div><div class="grid">'+
  games.map(function(g,i){if((i<12?0:i<18?1:2)!=cat)return '';return '<button class="card" style="background:'+g[2]+'" onclick="play('+i+')"><span>'+g[1]+'</span>'+g[0]+'<small style="font-size:14px;background:#fff3;border-radius:12px;padding:2px 10px">🏁 مرحلة '+(P.lv[i]||1)+'</small></button>'}).join('')+'</div>';
  speak('أهلاً بك في مغامرة النجوم');
}
function setAge(a){age=a;P.age=a;save();home()}
function play(i){clearInterval(tm);tone(660,.1);gi=i;lv=P.lv[i]||1;ok=0;hearts=3;streak=0;games[i][3]()}
// generic round: q text, display html, options [{h,ok}], next fn
function round(q,show,cls,opts,next,say){
  app.innerHTML='<div class="top"><button class="back" onclick="home()">🏠</button><div class="stars">⭐ '+stars+'</div></div>'+hud()+'<div class="mas" id="mas" style="font-size:46px">'+mch()+'</div><div class="q">'+q+'</div><div class="show '+(cls||'')+'">'+show+'</div><div class="opts" id="o"></div>';
  var o=document.getElementById('o');
  shuffle(opts).forEach(function(x){
    var b=document.createElement('button');b.className='opt';b.innerHTML=x.h;
    b.onclick=function(){
      if(x.ok){b.classList.add('good');addStar();ok++;streak++;if(streak%3==0){addStar();speak('ثلاثة ورا بعض! نجمة إضافية')}var ms=document.getElementById('mas');if(ms)ms.textContent='🥳';tone(880,.15);setTimeout(function(){tone(1175,.2)},150);
        var c=document.createElement('div');c.className='cheer';c.textContent=pick(['🎉','🌟','👏','🏆','🥳']);document.body.appendChild(c);
        speak(pick(['أحسنت','ممتاز','برافو','رائع']));setTimeout(function(){c.remove();ok>=5?levelUp():next()},1200)}
      else{b.classList.add('bad');hearts--;streak=0;var hb=document.querySelector('.hud b:last-child');if(hb)hb.textContent='❤️'.repeat(Math.max(hearts,0));if(hearts<=0)setTimeout(lose,700);var ms=document.getElementById('mas');if(ms)ms.textContent='🙈';tone(220,.25);speak('حاول مرة ثانية')}
    };o.appendChild(b)});
  readAll(say||q);
}
function count(){
  var max=Math.min((age?5:3)+lv*2,age?20:10),n=R(1,max),e=pick(fruits),w=[n];
  while(w.length<3){var v=R(1,max);if(w.indexOf(v)<0)w.push(v)}
  round('كم عددها؟',new Array(n+1).join(e),'',w.map(function(v){return{h:v,ok:v==n}}),count);
}
function letter(){
  var L=letters.slice(0,Math.min(5+lv*2,16)),it=pick(L),w=[it];
  while(w.length<3){var v=pick(L);if(w.indexOf(v)<0&&v[0]!=it[0])w.push(v)}
  round('أي صورة تبدأ بحرف '+it[0]+'؟',it[0],'big',w.map(function(v){return{h:v[2],ok:v==it}}),letter,'أي صورة تبدأ بحرف '+it[0]+'، مثل '+it[1]);
}
function color(){
  var n=Math.min((age?3:2)+Math.ceil(lv/2),6),w=shuffle(colors).slice(0,n),t=pick(w);
  round('اضغط على اللون '+t[0],'🎨','',w.map(function(v){return{h:'<span class="dot" style="background:'+v[1]+'"></span>',ok:v==t}}),color);
}
function math(){
  var a,b,ans,txt,sub=age&&Math.random()<.4;
  if(!age){a=R(1,Math.min(2+lv,6));b=R(1,Math.min(2+lv,6));ans=a+b;txt='🍎'.repeat(a)+' ➕ '+'🍎'.repeat(b)}
  else if(sub){a=R(5,10+lv*3);b=R(1,a-1);ans=a-b;txt=a+' − '+b+' = ؟'}
  else{a=R(2,6+lv*2);b=R(2,6+lv*2);ans=a+b;txt=a+' + '+b+' = ؟'}
  var w=[ans];while(w.length<3){var v=Math.max(0,ans+R(-3,3));if(w.indexOf(v)<0)w.push(v)}
  var say=age?(sub?a+' ناقص '+b:a+' زائد '+b):'كم المجموع؟';
  round(age?'احسب الناتج':'كم المجموع؟',txt,age?'big':'',w.map(function(v){return{h:v,ok:v==ans}}),math,say);
}
var animals=[['البقرة','🐮','موو'],['القطة','🐱','مياو'],['الكلب','🐶','هاو هاو'],['البطة','🦆','كواك'],['الأسد','🦁','غررر'],['الخروف','🐑','ماع'],['الحصان','🐴','هيهيهي'],['الديك','🐓','كوكوكو'],['الضفدع','🐸','نق نق'],['النحلة','🐝','زززز']];
function animal(){
  var it=pick(animals),w=[it];
  while(w.length<3){var v=pick(animals);if(w.indexOf(v)<0)w.push(v)}
  var s=it[2];
  round('مين يقول '+s+'؟','🔊 '+s,'big',w.map(function(v){return{h:v[1],ok:v==it}}),animal,'مين بيقول '+it[2]+'؟');
}
var shapes=[['الدائرة','⭕'],['المربع','🟦'],['المثلث','🔺'],['النجمة','⭐'],['القلب','❤️'],['المعين','🔶']];
function shape(){
  var w=shuffle(shapes).slice(0,Math.min(2+lv,6)),t=pick(w);
  round('اضغط على '+t[0],'🔷','',w.map(function(v){return{h:v[1],ok:v==t}}),shape);
}
function pattern(){
  var e=shuffle(fruits).slice(0,3),seq=age?[e[0],e[1],e[2],e[0],e[1],e[2],e[0],e[1]]:[e[0],e[1],e[0],e[1],e[0]],ans=age?e[2]:e[1];
  round('شو الصورة الجاية؟',seq.join(' ')+' ❓','',e.map(function(v){return{h:v,ok:v==ans}}),pattern);
}
function memory(){
  var n=Math.min(2+lv,age?8:6),e=shuffle(fruits.concat(['🐶','🐱'])).slice(0,n),cards=shuffle(e.concat(e)),open=[],lock=false,done=0;
  app.innerHTML='<div class="top"><button class="back" onclick="home()">🏠</button><div class="stars" id="st">⭐ '+stars+'</div></div><div class="q">🏁 مرحلة '+lv+' · لاقي الصور المتشابهة</div><div class="mem" style="grid-template-columns:repeat('+(n>4?4:3)+',1fr)" id="m"></div>';
  var m=document.getElementById('m');
  cards.forEach(function(c){var b=document.createElement('button');b.className='mc';b.onclick=function(){
    if(lock||b.classList.contains('up'))return;
    b.classList.add('up');b.textContent=c;tone(500,.08);open.push([b,c]);
    if(open.length==2){lock=true;
      if(open[0][1]==open[1][1]){addStar();tone(880,.15);done++;open=[];lock=false;document.getElementById('st').textContent='⭐ '+stars;speak('أحسنت');
        if(done==n){var d=document.createElement('div');d.className='cheer';d.textContent='🏆';document.body.appendChild(d);setTimeout(function(){d.remove();levelUp()},1300)}}
      else setTimeout(function(){open.forEach(function(x){x[0].classList.remove('up');x[0].textContent=''});open=[];lock=false},800)}
  };m.appendChild(b)});
  speak('لاقي الصور المتشابهة');
}
function mch(){return stars<10?'🥚':stars<25?'🐣':stars<50?'🐥':stars<100?'🐻':'🦁'}
function msg(){return stars<10?'أنا بيضة! اجمع نجوم لتفقس 🥚':stars<25?'فقست! كمّل نجوم لأكبر 🐣':stars<50?'صرت كتكوت! بدي أكبر أكتر 🐥':stars<100?'صرت دبدوب قوي! 🐻':'أنا الأسد ملك النجوم! 🦁👑'}
function speakEn(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
var wk=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
function days(){
  var i=R(0,6),after=!age||Math.random()<.5,t=wk[(i+(after?1:6))%7],w=[t];
  while(w.length<3){var v=pick(wk);if(w.indexOf(v)<0&&v!=wk[i])w.push(v)}
  var q='شو اليوم '+(after?'بعد ':'قبل ')+wk[i]+'؟';
  round(q,'📅 '+wk[i],'',w.map(function(v){return{h:'<span style="font-size:20px">'+v+'</span>',ok:v==t}}),days);
}
var ops=[['كبير','صغير'],['طويل','قصير'],['حار','بارد'],['فوق','تحت'],['سريع','بطيء'],['فرحان','حزين'],['نهار','ليل'],['ممتلئ','فارغ'],['قوي','ضعيف'],['جديد','قديم'],['قريب','بعيد'],['مفتوح','مسكر']];
function opp(){
  var p=pick(ops),f=Math.random()<.5,a=p[f?0:1],b=p[f?1:0],all=[];
  ops.forEach(function(x){x.forEach(function(y){if(y!=a&&y!=b)all.push(y)})});
  var w=[b].concat(shuffle(all).slice(0,2));
  round('شو عكس كلمة «'+a+'»؟',a,'',w.map(function(v){return{h:'<span style="font-size:24px">'+v+'</span>',ok:v==b}}),opp);
}
var en=[['Apple','🍎'],['Cat','🐱'],['Dog','🐶'],['Sun','☀️'],['Car','🚗'],['Fish','🐟'],['Book','📖'],['Star','⭐'],['Ball','⚽'],['Tree','🌳'],['Milk','🥛'],['Bird','🐦']];
function eng(){
  var it=pick(en),w=[it];
  while(w.length<3){var v=pick(en);if(w.indexOf(v)<0)w.push(v)}
  round('شو اسمها بالإنجليزي؟',it[1],'',w.map(function(v){return{h:'<span style="font-size:24px">'+v[0]+'</span>',ok:v==it}}),eng);
  setTimeout(function(){speakEn(it[0])},1800);
}
function missing(){
  var st=age?pick([1,2,5,10]):1,s=age?R(0,5)*st+st:R(1,3),seq=[0,1,2,3,4].map(function(k){return s+k*st}),h=R(1,3),ans=seq[h],w=[ans];
  while(w.length<3){var v=ans+R(-2,2)*st;if(v>0&&w.indexOf(v)<0)w.push(v)}
  seq[h]='❓';
  round('شو الرقم الناقص؟',seq.join(' · '),'',w.map(function(v){return{h:v,ok:v==ans}}),missing);
}
function hud(){return '<div class="hud"><button class="back" style="width:34px;height:34px;font-size:16px" onclick="readAll(curQ)">🔊</button><b>🏁 مرحلة '+lv+'</b><span class="bar"><i style="width:'+ok*20+'%"></i></span><b>'+'❤️'.repeat(Math.max(hearts,0))+'</b>'+(streak>1?'<b>🔥'+streak+'</b>':'')+'</div>'}
function confetti(){for(var k=0;k<30;k++){var s=document.createElement('span');s.className='cf';s.textContent=pick(['🎉','⭐','🎈','✨','🌟','💖']);s.style.left=R(0,95)+'vw';s.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(s);(function(x){setTimeout(function(){x.remove()},3500)})(s)}}
function levelUp(){
  var b=['🥉','🥈','🥇','🏅','🎖️','🏆','💎','🚀','🦄','👑'][Math.min(lv-1,9)];
  P.lv[gi]=lv+1;addStar();addStar();addStar();save();confetti();tone(523,.15);setTimeout(function(){tone(659,.15)},150);setTimeout(function(){tone(784,.3)},300);

function mk(){var n=document.getElementById('nm').value.trim()||'بطل';db.list.push({n:n,a:sel,stars:0,age:0,lv:{}});choose(db.list.length-1)}
var cat=0;
function qz(bank,nx,z,say){var B=bank.slice(0,Math.min(4+lv*2,bank.length)),it=pick(B);round(it[0],it[4]||'🕌','',[it[1],it[2],it[3]].map(function(v){return{h:'<span style=font-size:'+(z||22)+'px>'+v+'</span>',ok:v==it[1]}}),nx)}
var IS=[['كم عدد أركان الإسلام؟','٥','٣','٧','5️⃣'],['شو كتاب المسلمين؟','القرآن الكريم','كتاب القصص','كتاب الألوان','📖'],['بأي شهر نصوم؟','رمضان','شعبان','محرم','🌙'],['وين الكعبة؟','مكة المكرمة','المدينة المنورة','القدس','🕋'],['مين آخر الأنبياء؟','محمد ﷺ','موسى','نوح','🌟'],['كم صلاة نصلي باليوم؟','٥','٣','٧','🤲'],['شو العيد بعد رمضان؟','عيد الفطر','عيد الأضحى','رأس السنة','🎉'],['بأي عيد نذبح الأضحية؟','عيد الأضحى','عيد الفطر','عيد الأم','🐑'],['شو أول سورة في القرآن؟','الفاتحة','البقرة','الإخلاص','📖'],['مين أول الأنبياء؟','آدم','نوح','عيسى','🌱'],['وين المسجد الأقصى؟','القدس','مكة','المدينة','🕌'],['شو اسم مسجد النبي في المدينة؟','المسجد النبوي','المسجد الأقصى','المسجد الحرام','🕌'],['كم سورة في القرآن؟','١١٤','٩٩','٣٠','📖']];
function islamQ(){qz(IS,islamQ)}
var pr=['الفجر','الظهر','العصر','المغرب','العشاء'],rk=[2,4,4,3,4];
function salah(){
  var i=R(0,4);
  if((age||lv>2)&&Math.random()<.5){round('كم ركعة في صلاة '+pr[i]+'؟','🕌 '+pr[i],'',[2,3,4].map(function(v){return{h:v,ok:v==rk[i]}}),salah);return}

}
var AD=[['قبل ما نبدأ الأكل شو نقول؟','بسم الله','الحمد لله','مع السلامة','🍽️'],['بعد ما نخلص أكل؟','الحمد لله','بسم الله','صباح الخير','🥛'],['لما نلتقي حدا؟','السلام عليكم','مع السلامة','بسم الله','👋'],['لما نعطس؟','الحمد لله','بسم الله','سبحان الله','🤧'],['لما حدا يعطس ويحمد الله؟','يرحمك الله','بسم الله','مع السلامة','👂'],['لما حدا يعمل معنا معروف؟','جزاك الله خيراً','مع السلامة','بسم الله','🎁'],['لما نشوف شي حلو؟','ما شاء الله','مع السلامة','صباح الخير','🌈'],['لما نوعد حدا بشي؟','إن شاء الله','الحمد لله','جزاك الله خيراً','🤝']];
function adhkar(){qz(AD,adhkar,20)}
var PR=[['مين صاحب السفينة؟','نوح','يونس','موسى','🚢'],['مين النبي اللي كان ببطن الحوت؟','يونس','نوح','سليمان','🐋'],['مين النبي اللي فلق الله له البحر؟','موسى','يوسف','إبراهيم','🌊'],['مين النبي اللي فهم لغة النمل؟','سليمان','داود','يونس','🐜'],['مين بنى الكعبة مع ابنه إسماعيل؟','إبراهيم','نوح','آدم','🕋'],['مين النبي المعروف بصبره؟','أيوب','يوسف','موسى','💪'],['مين النبي اللي ألان الله له الحديد؟','داود','سليمان','عيسى','🛡️'],['مين النبي اللي صار عزيز مصر؟','يوسف','يعقوب','موسى','👑']];
function prophet(){qz(PR,prophet)}
var SU=[['الفيل','🐘'],['النحل','🐝'],['النمل','🐜'],['البقرة','🐄'],['القمر','🌙'],['الشمس','☀️'],['العنكبوت','🕷️'],['التين','🫒'],['الفجر','🌅'],['الليل','🌃']];
function surah(){
  var P2=SU.slice(0,Math.min(4+lv*2,SU.length)),it=pick(P2),w=[it];
  while(w.length<3){var v=pick(P2);if(w.indexOf(v)<0)w.push(v)}
  round('أي سورة اسمها من الصورة؟',it[1],'',w.map(function(v){return{h:'<span style=font-size:24px>'+v[0]+'</span>',ok:v==it}}),surah);
}
var AK=[['صديقك وقع على الأرض، شو بتعمل؟','بساعده','بضحك عليه','بتركه','🤕'],['لقيت لعبة مش إلك؟','برجعها لصاحبها','بخبّيها','برميها','🧸'],['أخوك الصغير جوعان وعندك حلوى؟','بشاركه','بخبّيها','بكلها لحالي','🍬'],['لما بقابل جارنا؟','بسلّم عليه','بتجاهله','بهرب','🏠'],['ماما طلبت ترتب غرفتك؟','برتبها فوراً','بزعل','بنام','🛏️'],['غلطت وكذبت؟','بعترف وبعتذر','بكمل كذب','بلوم غيري','🤥'],['شفت حدا عم يضايق صاحبك؟','بدافع عنه وبخبر المعلمة','بتفرج','بضحك','🛡️']];
function akhlaq(){qz(AK,akhlaq,17)}
var curQ='';
function readAll(q){
  curQ=q;speak(q);
  if(!P||P.rd===false)return;
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(b){
    var t=b.textContent.trim();
    if(!/[\u0600-\u06FF0-9A-Za-z]/.test(t))return;
    try{var u=new SpeechSynthesisUtterance(t);u.lang=/^[A-Za-z ]+$/.test(t)?'en-US':'ar-SA';u.rate=.85;speechSynthesis.speak(u)}catch(e){}
  });
}
var tm=0;
function updHud(){var h=document.querySelector('.hud');if(h)h.outerHTML=hud()}
function hit(){ok++;streak++;addStar();if(streak%3==0)addStar();tone(880,.12);updHud()}
function miss(){hearts--;streak=0;tone(220,.25);updHud();if(hearts<=0){clearInterval(tm);setTimeout(lose,500);return true}return false}
function balloon(){
  clearInterval(tm);
  var kind=Math.random()<.5,mx=age?20:9,pool=[];
  if(kind){for(var i=1;i<=mx;i++)pool.push(''+i)}else{pool=letters.slice(0,Math.min(5+lv*2,16)).map(function(l){return l[0]})}
  var tg='';
  app.innerHTML='<div class=top><button class=back onclick="home()">🏠</button></div>'+hud()+'<div class=q id=bq></div><div class=sky id=sky></div>';
  function ask(){tg=pick(pool);var t='فقّع البالون '+(kind?'رقم ':'حرف ')+tg;document.getElementById('bq').textContent='🎈 '+t;speak(t)}
  ask();
  tm=setInterval(function(){
    var sky=document.getElementById('sky');if(!sky){clearInterval(tm);return}
    var v=Math.random()<.4?tg:pick(pool),b=document.createElement('div');
    b.className='bl';b.textContent=v;b.style.left=R(2,76)+'%';b.style.background=pick(['#ff6b6b','#e6a700','#4dabf7','#40c057','#da77f2','#ff922b']);
    b.style.animationDuration=Math.max(3,7.5-lv*.4)+'s';
    b.addEventListener('animationend',function(){b.remove()});
    b.onclick=function(){
      if(b.dataset.x)return;b.dataset.x=1;
      if(v==tg){hit();b.textContent='💥';setTimeout(function(){b.remove()},300);if(ok>=5){clearInterval(tm);setTimeout(levelUp,600)}else ask()}
      else{b.textContent='😮';setTimeout(function(){b.remove()},300);miss()}
    };
    sky.appendChild(b)},900);
}
function match(){
  clearInterval(tm);
  var en2=age&&Math.random()<.5,src=en2?en:animals,items=shuffle(src).slice(0,5).map(function(x){return{n:x[0],e:x[1]}}),L=shuffle(items),Rr=shuffle(items),sel=null,lb=[];
  app.innerHTML='<div class=top><button class=back onclick="home()">🏠</button></div>'+hud()+'<div class=q>🔗 وصّل كل صورة باسمها</div><div class=grid id=mt></div>';
  var g=document.getElementById('mt');
  speak('وصّل كل صورة باسمها');
  for(var i=0;i<5;i++){[L[i],Rr[i]].forEach(function(it,k){
    var b=document.createElement('button');b.className='opt';b.style.cssText='min-height:72px;font-size:'+(k?'22px':'44px');b.textContent=k?it.n:it.e;
    b.onclick=function(){
      if(b.disabled)return;
      if(!k){lb.forEach(function(x){x.style.outline='none'});sel=it;it.b=b;b.style.outline='5px solid #ff9f1c';tone(600,.08);return}
      if(!sel){speak('اختار صورة أول');return}
      if(sel===it){b.disabled=true;it.b.disabled=true;b.classList.add('good');it.b.classList.add('good');it.b.style.outline='none';sel=null;hit();if(en2)speakEn(it.n);else speak(it.n);if(ok>=5){setTimeout(levelUp,1000)}}
      else{b.classList.add('bad');setTimeout(function(){b.classList.remove('bad')},400);miss()}
    };
    if(!k)lb.push(b);g.appendChild(b)})}
}
function spell(){
  clearInterval(tm);
  var W=letters.slice().sort(function(a,b){return a[1].length-b[1].length}),pool=W.slice(0,Math.min(5+lv*2,16)),it=pick(pool),word=it[1].split(''),pos=0;
  app.innerHTML='<div class=top><button class=back onclick="home()">🏠</button></div>'+hud()+'<div class=q>✨ ركّب اسم الصورة</div><div class="show big" style="font-size:80px;min-height:100px">'+it[2]+'</div><div class=slots id=sl></div><div class=opts id=lt style="grid-template-columns:repeat(4,1fr)"></div>';
  var sl=document.getElementById('sl'),lt=document.getElementById('lt'),sp=[];
  word.forEach(function(){var s=document.createElement('span');s.textContent='·';sl.appendChild(s);sp.push(s)});
  shuffle(word).forEach(function(c){var b=document.createElement('button');b.className='opt';b.style.cssText='min-height:70px;font-size:38px';b.textContent=c;
    b.onclick=function(){
      if(b.disabled)return;
      if(c==word[pos]){sp[pos].textContent=c;b.disabled=true;b.classList.add('good');pos++;tone(700,.1);
        if(pos==word.length){hit();speak(it[1]);if(ok>=5)setTimeout(levelUp,1300);else setTimeout(spell,1500)}}
      else{b.classList.add('bad');setTimeout(function(){b.classList.remove('bad')},400);miss()}
    };lt.appendChild(b)});
  speak('ركّب اسم الصورة');
}
function race(){
  clearInterval(tm);
  var m=age?8+lv*2:4+lv,a=R(1,m),b=R(1,m),ans=a+b,w=[ans],T=Math.max(5,(age?11:15)-lv);
  while(w.length<3){var v=Math.max(0,ans+R(-3,3));if(w.indexOf(v)<0)w.push(v)}
  round('⚡ أسرع! '+a+' + '+b,a+' + '+b+' = ؟','',w.map(function(v){return{h:v,ok:v==ans}}),race,a+' زائد '+b);
  var o=document.getElementById('o');
  o.insertAdjacentHTML('beforebegin','<div class=tb><i style="animation-duration:'+T+'s"></i></div>');
  o.addEventListener('click',function(){setTimeout(function(){if(document.querySelector('.opt.good'))clearTimeout(tm)},0)});
  tm=setTimeout(function(){if(!document.getElementById('o')||document.querySelector('.opt.good'))return;if(!miss())race()},T*1000);
}
if(!db.list||!db.list.length){db.list=[{n:'مريم',a:'🐰',stars:0,age:0,lv:{}},{n:'خلدون',a:'🦊',stars:0,age:0,lv:{}}];db.cur=-1}
if(db.cur>=0&&db.list[db.cur]){choose(db.cur)}else{who()}
